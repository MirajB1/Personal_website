<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function(){var d=document.documentElement;try{var s=localStorage.getItem('mb-theme');
d.setAttribute('data-theme', s || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));}catch(e){}})();
</script>
<title>404 — Miraj Bhattarai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0E12;--bg2:#10151B;--bg3:#151B23;--line:#232B36;--ink:#E7EEF5;--ink2:#9BA9B8;--ink3:#6A7787;--acc:#4FD1A5;color-scheme:dark}
  [data-theme="light"]{--bg:#FBFBF9;--bg2:#FFF;--bg3:#F4F5F2;--line:#E1E4DE;--ink:#10151A;--ink2:#4B5560;--ink3:#79838E;--acc:#0B8F66;color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
       font-family:'Inter',system-ui,sans-serif;line-height:1.6}
  .win{width:min(560px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;
       box-shadow:0 24px 60px -32px rgba(0,0,0,.9)}
  .tb{display:flex;align-items:center;gap:7px;padding:9px 14px;background:var(--bg3);border-bottom:1px solid var(--line)}
  .tb i{width:9px;height:9px;border-radius:50%;display:block}
  .tb i:nth-child(1){background:#E5695B}.tb i:nth-child(2){background:#E0B24C}.tb i:nth-child(3){background:var(--acc)}
  .tb span{font-family:'JetBrains Mono',monospace;font-size:.73rem;color:var(--ink3);margin-left:8px}
  .bd{padding:30px 28px 32px}
  pre{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--ink3);line-height:1.9;margin-bottom:20px;white-space:pre-wrap}
  .ps1{color:var(--acc);font-weight:700}
  .err{color:#FF6B4A}
  h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.5rem,5vw,2rem);font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--ink2);font-size:.95rem;margin-bottom:24px}
  a{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.83rem;font-weight:500;
    padding:11px 18px;border-radius:8px;background:var(--acc);color:#04120C;text-decoration:none;
    transition:transform .2s ease,filter .2s ease}
  [data-theme="light"] a{color:#fff}
  a:hover{transform:translateY(-2px);filter:brightness(1.08)}
</style>
</head>
<body>
  <main class="win">
    <div class="tb"><i></i><i></i><i></i><span>bash</span></div>
    <div class="bd">
      <pre><span class="ps1">$</span> cd <span id="p">this-page</span>
bash: <span class="err">no such file or directory</span></pre>
      <h1>404</h1>
      <p>That path doesn't exist on this site. Everything lives on the home page.</p>
      <a href="/"><span class="ps1" style="color:inherit;opacity:.55">$</span> cd ~</a>
    </div>
  </main>
  <script>
    try{ var p=location.pathname.replace(/^\//,'')||'this-page';
         document.getElementById('p').textContent=p.slice(0,48); }catch(e){}
  </script>
</body>
</html>
